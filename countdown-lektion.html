<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nedräkning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --hue: 150; --accent: hsl(var(--hue) 75% 55%); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0f1117; color: #e8eaf0;
    font-family: Inter, system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* ---------- Kontroller ---------- */
  .panel {
    display: flex; flex-wrap: wrap; gap: .6rem 1.2rem; align-items: center; justify-content: center;
    padding: .9rem 1rem; background: #171a23; border-bottom: 1px solid #262a36;
    transition: opacity .4s; position: relative; z-index: 10;
  }
  body.running .panel { opacity: .25; }
  body.running .panel:hover { opacity: 1; }
  .group { display: flex; align-items: center; gap: .4rem; }
  label { font-size: .85rem; color: #9aa1b2; }
  input[type=number] {
    width: 4.2rem; padding: .45rem .5rem; font: 600 1.1rem 'JetBrains Mono', monospace;
    background: #0f1117; color: #fff; border: 1px solid #333849; border-radius: 8px; text-align: center;
  }
  select {
    padding: .45rem .5rem; background: #0f1117; color: #fff; border: 1px solid #333849; border-radius: 8px; font: inherit;
  }
  button {
    font: 600 .95rem Inter, sans-serif; padding: .5rem .9rem; border-radius: 8px; cursor: pointer;
    background: #262a36; color: #e8eaf0; border: 1px solid #333849; transition: background .15s, transform .1s;
  }
  button:hover { background: #313646; }
  button:active { transform: scale(.96); }
  button.primary { background: var(--accent); color: #0f1117; border-color: transparent; min-width: 6.5rem; }
  .preset { padding: .4rem .65rem; font-size: .85rem; }

  /* ---------- Scen ---------- */
  .stage { flex: 1; position: relative; display: grid; place-items: center; overflow: hidden; }
  .scene { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 2vh; }

  /* Siffror */
  .digits {
    position: relative; z-index: 2;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: -.02em;
    font-size: min(13vw, 12vh); line-height: 1; white-space: nowrap;
    font-variant-numeric: tabular-nums; text-shadow: 0 0 30px hsl(var(--hue) 75% 55% / .35);
  }
  .digits .small { font-size: .55em; color: var(--accent); transition: color .5s; }
  body.mode-water .digits, body.mode-none .digits { font-size: min(17vw, 26vh); }
  body.mode-hourglass .digits, body.mode-rocket .digits,
  body.mode-candle .digits, body.mode-dots .digits { font-size: min(11vw, 11vh); }
  body.urgent .digits { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  /* Visa bara aktuell animation */
  .vis { display: none; height: min(56vh, 70vw); }
  body.mode-hourglass #v-hourglass, body.mode-rocket #v-rocket,
  body.mode-candle #v-candle, body.mode-dots #v-dots { display: block; }
  body.mode-dots #v-dots { width: min(80vw, 90vh); height: auto; }

  /* Ring */
  .ringwrap { position: relative; width: min(82vw, 72vh); aspect-ratio: 1; display: none; place-items: center; }
  body.mode-ring .ringwrap { display: grid; }
  .ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 3.2; }
  .ring .track { stroke: #232733; }
  .ring .bar { stroke: var(--accent); stroke-linecap: round; filter: drop-shadow(0 0 2.5px var(--accent)); transition: stroke .5s; }
  .ring .dot { fill: #fff; filter: drop-shadow(0 0 3px var(--accent)); }

  /* Vattennivå */
  .water {
    position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
    background: hsl(var(--hue) 70% 45% / .55); transition: background .5s; display: none;
  }
  .water svg { position: absolute; top: -38px; left: 0; width: 200%; height: 40px; animation: wave 3s linear infinite; }
  .water svg path { fill: hsl(var(--hue) 70% 45% / .55); transition: fill .5s; }
  @keyframes wave { to { transform: translateX(-50%); } }
  body.mode-water .water { display: block; }

  /* Timglas */
  .glass { fill: hsl(220 30% 80% / .06); stroke: #8b93a8; stroke-width: 1.4; }
  .sand { fill: hsl(var(--hue) 70% 58%); transition: fill .5s; }
  .stream { stroke: hsl(var(--hue) 70% 58%); stroke-width: 1.4; stroke-dasharray: 2 2.5; animation: fall .25s linear infinite; opacity: 0; }
  body.running .stream { opacity: 1; }
  @keyframes fall { to { stroke-dashoffset: -4.5; } }
  .frame { fill: #5b4632; }

  /* Raket */
  .star { fill: #fff; animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 50% { opacity: .2; } }
  .flame { transform-box: fill-box; transform-origin: 50% 0; opacity: 0; }
  body.running .flame, body.done .flame { opacity: 1; animation: flick .12s ease-in-out infinite alternate; }
  @keyframes flick { from { transform: scaleY(.75) scaleX(.9); } to { transform: scaleY(1.2) scaleX(1.05); } }
  body.urgent #rocket .ship { animation: shake .09s linear infinite; }
  @keyframes shake { 25% { transform: translateX(-.6px); } 75% { transform: translateX(.6px); } }
  .trail { stroke: #3a4052; stroke-width: .8; stroke-dasharray: 1.5 2.5; fill: none; }

  /* Stearinljus */
  .cflame { transform-box: fill-box; transform-origin: 50% 100%; animation: candle 1.6s ease-in-out infinite; }
  @keyframes candle {
    0%,100% { transform: scale(1) rotate(0); }
    25% { transform: scale(1.05, .95) rotate(-3deg); }
    50% { transform: scale(.95, 1.08) rotate(2deg); }
    75% { transform: scale(1.03, .97) rotate(-1deg); }
  }
  .smoke { opacity: 0; }
  body.done .smoke { animation: smoke 2.5s ease-out forwards; }
  body.done .cflamegrp { opacity: 0; transition: opacity .3s; }
  @keyframes smoke { 0% { opacity: .8; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-30px); } }

  /* Prickar */
  #v-dots circle { transition: r .15s, fill .5s; }

  .hint { position: absolute; bottom: .8rem; font-size: .8rem; color: #5d6476; z-index: 2; }

  /* Slut */
  body.done .stage { animation: flash .6s ease-out 3; }
  @keyframes flash { 0% { background: hsl(0 80% 55% / .55); } 100% { background: transparent; } }
  .doneText {
    position: absolute; z-index: 3; top: 6%; font: 700 min(7vw, 8vh) Inter, sans-serif; letter-spacing: .05em;
    color: #fff; opacity: 0; transform: scale(.6); transition: all .4s cubic-bezier(.2, 1.6, .4, 1);
    text-shadow: 0 0 20px #000;
  }
  body.done .doneText { opacity: 1; transform: scale(1); }
  canvas#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
</style>
</head>
<body class="mode-ring">

<div class="panel">
  <div class="group">
    <label for="min">Min</label><input id="min" type="number" min="0" max="999" value="5">
    <label for="sec">Sek</label><input id="sec" type="number" min="0" max="59" value="0">
  </div>
  <div class="group">
    <button class="preset" data-s="30">0:30</button>
    <button class="preset" data-s="60">1</button>
    <button class="preset" data-s="180">3</button>
    <button class="preset" data-s="300">5</button>
    <button class="preset" data-s="600">10</button>
    <button class="preset" data-s="900">15</button>
  </div>
  <div class="group">
    <button id="startBtn" class="primary">Starta</button>
    <button id="resetBtn">Nollställ</button>
  </div>
  <div class="group">
    <label for="mode">Animation</label>
    <select id="mode">
      <option value="ring">Ring</option>
      <option value="hourglass">Timglas</option>
      <option value="rocket">Raket till månen</option>
      <option value="candle">Stearinljus</option>
      <option value="dots">Prickar</option>
      <option value="water">Vattennivå</option>
      <option value="none">Bara siffror</option>
    </select>
    <label for="sound">Ljud</label>
    <select id="sound">
      <option value="applause">Applåd (från 7 s)</option>
      <option value="dive">Dykljud (från 5 s)</option>
      <option value="none">Inget ljud</option>
    </select>
    <button id="fsBtn" title="Helskärm (F)">⛶</button>
  </div>
</div>

<div class="stage" id="stage">
  <div class="water" id="water">
    <svg viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20 Q 75 0 150 20 T 300 20 T 450 20 T 600 20 T 750 20 T 900 20 T 1050 20 T 1200 20 V40 H0 Z"/></svg>
  </div>

  <div class="scene" id="scene">
    <!-- Ring -->
    <div class="ringwrap" id="ringwrap">
      <svg class="ring" viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="46"/>
        <circle class="bar" id="bar" cx="50" cy="50" r="46"/>
        <circle class="dot" id="dot" r="2.2" cx="96" cy="50"/>
      </svg>
    </div>

    <!-- Timglas -->
    <svg class="vis" id="v-hourglass" viewBox="0 0 100 170">
      <defs>
        <clipPath id="topBulb"><path d="M16 16 H84 Q84 54 52.5 81 H47.5 Q16 54 16 16 Z"/></clipPath>
        <clipPath id="botBulb"><path d="M47.5 89 H52.5 Q84 116 84 154 H16 Q16 116 47.5 89 Z"/></clipPath>
      </defs>
      <rect class="frame" x="8" y="8" width="84" height="8" rx="2"/>
      <rect class="frame" x="8" y="154" width="84" height="8" rx="2"/>
      <rect class="frame" x="12" y="16" width="3" height="138"/>
      <rect class="frame" x="85" y="16" width="3" height="138"/>
      <rect class="sand" id="sandTop" clip-path="url(#topBulb)" x="0" y="24" width="100" height="60"/>
      <line class="stream" id="stream" x1="50" y1="81" x2="50" y2="154"/>
      <rect class="sand" id="sandBot" clip-path="url(#botBulb)" x="0" y="154" width="100" height="0"/>
      <path class="glass" d="M16 16 H84 Q84 54 52.5 81 V89 Q84 116 84 154 H16 Q16 116 47.5 89 V81 Q16 54 16 16 Z"/>
    </svg>

    <!-- Raket -->
    <svg class="vis" id="v-rocket" viewBox="0 0 100 170">
      <g id="stars"></g>
      <circle cx="50" cy="20" r="13" fill="#e9e4d4"/>
      <circle cx="45" cy="16" r="3" fill="#cfc8b2"/><circle cx="55" cy="24" r="2.2" fill="#cfc8b2"/><circle cx="54" cy="13" r="1.5" fill="#cfc8b2"/>
      <path d="M0 170 Q50 145 100 170 Z" fill="#2f6f9e"/>
      <path d="M20 166 Q30 158 42 160 Q38 165 20 166 Z M60 158 Q72 156 80 163 Q68 164 60 158 Z" fill="#3f8f4f"/>
      <line class="trail" x1="50" y1="36" x2="50" y2="150"/>
      <g id="rocket">
        <g class="ship">
          <path class="flame" d="M46 16 Q50 30 54 16 Z" fill="#ffb347"/>
          <path class="flame" d="M47.6 16 Q50 24 52.4 16 Z" fill="#fff3b0"/>
          <path d="M44 9 L40 16 L45 14 Z M56 9 L60 16 L55 14 Z" fill="#e05252"/>
          <path d="M50 -10 Q57 -2 56 14 H44 Q43 -2 50 -10 Z" fill="#eef0f5"/>
          <path d="M50 -10 Q54 -6 55.2 -2 H44.8 Q46 -6 50 -10 Z" fill="#e05252"/>
          <circle cx="50" cy="3" r="2.6" fill="#5fb8ff" stroke="#8b93a8" stroke-width=".8"/>
        </g>
      </g>
    </svg>

    <!-- Stearinljus -->
    <svg class="vis" id="v-candle" viewBox="0 0 100 170">
      <defs>
        <radialGradient id="glow"><stop offset="0" stop-color="#ffcf6b" stop-opacity=".45"/><stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/></radialGradient>
        <linearGradient id="wax" x1="0" x2="1"><stop offset="0" stop-color="#f3ece0"/><stop offset=".6" stop-color="#fffaf0"/><stop offset="1" stop-color="#d9cfbd"/></linearGradient>
      </defs>
      <g id="candleTop">
        <g class="cflamegrp">
          <circle cx="50" cy="-8" r="30" fill="url(#glow)"/>
          <g class="cflame">
            <path d="M50 -22 Q58 -8 54 -1 Q50 3 46 -1 Q42 -8 50 -22 Z" fill="#ffb347"/>
            <path d="M50 -14 Q54 -6 52.5 -2 Q50 0 47.5 -2 Q46 -6 50 -14 Z" fill="#fff3b0"/>
          </g>
        </g>
        <g class="smoke"><path d="M50 -2 Q46 -10 50 -16 Q54 -22 50 -30" stroke="#9aa1b2" stroke-width="1.2" fill="none"/></g>
        <line x1="50" y1="0" x2="50" y2="-3" stroke="#333" stroke-width="1"/>
      </g>
      <rect id="candleBody" x="38" y="40" width="24" height="110" rx="2" fill="url(#wax)"/>
      <ellipse cx="50" cy="152" rx="30" ry="5" fill="#8b93a8"/>
      <rect x="22" y="150" width="56" height="8" rx="3" fill="#6f7689"/>
    </svg>

    <!-- Prickar -->
    <svg class="vis" id="v-dots" viewBox="0 0 200 120"></svg>

    <div class="digits" id="digits">05:00<span class="small">,00</span></div>
  </div>

  <div class="doneText">TIDEN ÄR UTE!</div>
  <div class="hint">Mellanslag = start/paus · R = nollställ · F = helskärm</div>
  <canvas id="fx"></canvas>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const body = document.body, digits = $('digits'), bar = $('bar'), dot = $('dot'), water = $('water');
  const startBtn = $('startBtn'), minIn = $('min'), secIn = $('sec');
  const C = 2 * Math.PI * 46;
  bar.style.strokeDasharray = C;

  // Stjärnor till raketen
  for (let i = 0; i < 40; i++) {
    const s = document.createElementNS(NS, 'circle');
    s.setAttribute('class', 'star');
    s.setAttribute('cx', Math.random() * 100); s.setAttribute('cy', Math.random() * 140);
    s.setAttribute('r', Math.random() * .7 + .2);
    s.style.animationDelay = (Math.random() * 2.4) + 's';
    $('stars').appendChild(s);
  }
  // 60 prickar (10 × 6)
  const dots = [];
  for (let i = 0; i < 60; i++) {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', 10 + (i % 10) * 20); c.setAttribute('cy', 10 + Math.floor(i / 10) * 20);
    c.setAttribute('r', 7.5);
    $('v-dots').appendChild(c); dots.push(c);
  }

  let totalMs = 300000, remainingMs = 300000, endAt = 0, running = false, raf = 0, lastBeep = -1;

  function readInputs() {
    const m = Math.max(0, parseInt(minIn.value) || 0);
    const s = Math.min(59, Math.max(0, parseInt(secIn.value) || 0));
    totalMs = remainingMs = (m * 60 + s) * 1000;
  }

  function render() {
    const ms = Math.max(0, remainingMs);
    const cs = Math.floor(ms / 10);
    const m = Math.floor(cs / 6000), s = Math.floor(cs / 100) % 60, h = cs % 100;
    digits.innerHTML = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}<span class="small">,${String(h).padStart(2, '0')}</span>`;

    const f = totalMs ? ms / totalMs : 0;   // 1 → 0
    const accent = `hsl(${Math.round(150 * Math.pow(f, .8))} 75% 55%)`;
    document.documentElement.style.setProperty('--hue', Math.round(150 * Math.pow(f, .8)));

    // Ring
    bar.style.strokeDashoffset = C * (1 - f);
    const a = 2 * Math.PI * f;
    dot.setAttribute('cx', 50 + 46 * Math.cos(a)); dot.setAttribute('cy', 50 + 46 * Math.sin(a));
    dot.style.display = f > 0 ? '' : 'none';
    // Vatten
    water.style.height = (f * 100) + '%';
    // Timglas: sanden i övre kammaren sjunker, nedre växer
    const topY = 24 + (1 - f) * 57;
    $('sandTop').setAttribute('y', topY); $('sandTop').setAttribute('height', Math.max(0, 81 - topY));
    const botH = (1 - f) * 44;
    $('sandBot').setAttribute('y', 154 - botH); $('sandBot').setAttribute('height', botH);
    $('stream').setAttribute('y2', 154 - botH);
    $('stream').style.visibility = f > 0 && f < 1 ? 'visible' : 'hidden';
    // Raket: från jorden (y 150) till månen (y 38)
    const p = 1 - f, ease = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    $('rocket').setAttribute('transform', `translate(0 ${138 - ease * 104})`);
    // Stearinljus
    const ch = 8 + f * 102;
    $('candleBody').setAttribute('y', 150 - ch); $('candleBody').setAttribute('height', ch);
    $('candleTop').setAttribute('transform', `translate(0 ${150 - ch})`);
    // Prickar: släcks bakifrån, den aktuella krymper gradvis
    const n = f * 60;
    dots.forEach((c, i) => {
      const k = Math.max(0, Math.min(1, n - i));
      c.setAttribute('r', k > 0 ? 2 + 5.5 * k : 7);
      c.setAttribute('fill', k > 0 ? accent : 'none');
      c.setAttribute('stroke', k > 0 ? 'none' : '#2c3140');
      c.setAttribute('stroke-width', 1);
    });

    body.classList.toggle('urgent', running && ms > 0 && ms <= 10000);
  }

  function tick() {
    remainingMs = endAt - performance.now();
    if (remainingMs <= 0) { remainingMs = 0; render(); finish(); return; }
    const snd = $('sound').value;
    if (snd === 'applause' && remainingMs <= APPL_START * 1000 && !applSrc) playApplause(APPL_START - remainingMs / 1000);
    if (snd === 'dive' && remainingMs <= DIVE_LEN * 1000 && !diveSrc) playDive(DIVE_LEN - remainingMs / 1000);
    render();
    raf = requestAnimationFrame(tick);
  }

  function start() {
    if (running) return;
    if (remainingMs <= 0 || body.classList.contains('done')) { body.classList.remove('done'); stopApplause(); readInputs(); }
    if (remainingMs <= 0) return;
    unlockAudio();
    running = true; body.classList.add('running');
    endAt = performance.now() + remainingMs;
    startBtn.textContent = 'Paus';
    raf = requestAnimationFrame(tick);
  }
  function pause() {
    running = false; cancelAnimationFrame(raf); stopDive(); stopApplause();
    body.classList.remove('running', 'urgent');
    startBtn.textContent = 'Fortsätt';
  }
  function reset() {
    pause(); stopApplause(); body.classList.remove('done'); stopConfetti();
    readInputs(); lastBeep = -1; startBtn.textContent = 'Starta'; render();
  }
  function finish() {
    running = false; body.classList.remove('running', 'urgent'); body.classList.add('done');
    startBtn.textContent = 'Starta';
    diveSrc = null;   // låt ljudet klinga ut
    if (applSrc === true) applSrc = null;   // applåden (om den spelas) får fortsätta
    confetti();
  }

  function setMode(m) {
    body.className = body.className.replace(/\bmode-\S+/g, '').trim();
    body.classList.add('mode-' + m);
    // Siffrorna ligger inne i ringen i ringläget, annars under animationen
    if (m === 'ring') $('ringwrap').appendChild(digits); else $('scene').appendChild(digits);
    try { localStorage.setItem('nedrakning-mode', m); } catch (e) {}
  }

  startBtn.onclick = () => running ? pause() : start();
  $('resetBtn').onclick = reset;
  [minIn, secIn].forEach(el => el.addEventListener('input', () => { if (!running) reset(); }));
  document.querySelectorAll('.preset').forEach(b => b.onclick = () => {
    const s = +b.dataset.s; minIn.value = Math.floor(s / 60); secIn.value = s % 60; reset();
  });
  $('mode').onchange = e => { setMode(e.target.value); e.target.blur(); };
  $('fsBtn').onclick = toggleFs;
  function toggleFs() {
    try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {}
  }
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') { e.preventDefault(); running ? pause() : start(); }
    else if (e.key === 'r' || e.key === 'R') reset();
    else if (e.key === 'f' || e.key === 'F') toggleFs();
  });

  /* ---------- Ljud ---------- */
  let ac = null;

  let applBuf = null, applSrc = null, applGain = null;
  function loadApplause() {
    if (applBuf || !ac) return;
    try {
      const bin = atob(APPL_B64), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      ac.decodeAudioData(arr.buffer, b => { applBuf = b; }, () => {});
    } catch (e) {}
  }
  function playApplause(offset) {
    stopApplause();
    applSrc = true;   // markera att applåden är hanterad, även om ljudet är avstängt
    if ($('sound').value !== 'applause' || !ac || !applBuf) return;
    try {
      applSrc = ac.createBufferSource(); applGain = ac.createGain();
      applGain.gain.value = .9; applSrc.buffer = applBuf;
      applSrc.connect(applGain).connect(ac.destination); applSrc.start(0, Math.max(0, offset || 0));
    } catch (e) {}
  }
  function stopApplause() {
    if (!applSrc || applSrc === true) { applSrc = null; return; }
    try {   // tona ut snabbt i stället för att klippa tvärt
      const t = ac.currentTime;
      applGain.gain.setValueAtTime(applGain.gain.value, t);
      applGain.gain.linearRampToValueAtTime(0, t + .3);
      applSrc.stop(t + .35);
    } catch (e) {}
    applSrc = null;
  }
  function beep(freq, dur) {
    if ($('sound').value === 'none' || !ac) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.3, t + .01);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch (e) {}
  }

  /* ---------- Konfetti ---------- */
  const cv = $('fx'), ctx = cv.getContext('2d');
  let parts = [], fxRaf = 0;
  function confetti() {
    const d = devicePixelRatio || 1;
    cv.width = cv.clientWidth * d; cv.height = cv.clientHeight * d;
    const W = cv.width, H = cv.height;
    parts = Array.from({ length: 220 }, () => ({
      x: W / 2, y: H * .55, vx: (Math.random() - .5) * 26 * d, vy: (-Math.random() * 24 - 8) * d,
      s: (5 + Math.random() * 7) * d, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      c: `hsl(${Math.random() * 360} 90% 60%)`
    }));
    cancelAnimationFrame(fxRaf);
    (function loop() {
      ctx.clearRect(0, 0, W, H);
      parts.forEach(p => {
        p.vy += .6 * d; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
      });
      parts = parts.filter(p => p.y < H + 40);
      if (parts.length) fxRaf = requestAnimationFrame(loop); else ctx.clearRect(0, 0, W, H);
    })();
  }
  function stopConfetti() { cancelAnimationFrame(fxRaf); parts = []; ctx.clearRect(0, 0, cv.width, cv.height); }

  let saved = 'ring';
  try { saved = localStorage.getItem('nedrakning-mode') || 'ring'; } catch (e) {}
  if (![...$('mode').options].some(o => o.value === saved)) saved = 'ring';
  $('mode').value = saved; setMode(saved);
  reset();
})();
